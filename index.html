function spark(vals,col){
  if(vals.length<2)return '';const mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1;
  const pts=vals.map((v,i)=>`${(i*100/(vals.length-1)).toFixed(1)},${(26-(v-mn)*22/rg).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="-2 0 104 30" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function healthReport(){
  const t=today();const days=[...Array(7)].map((_,k)=>addDays(t,-k));
  const first=Object.keys(D.medLog).filter(d=>Object.keys(D.medLog[d]||{}).length).sort()[0]||t; // бүртгэж эхэлсэн өдрөөс
  let sch=0,tk=0;days.filter(d=>d>=first).forEach(d=>{const log=D.medLog[d]||{};D.meds.forEach(m=>(m.times||[]).forEach(x=>{sch++;if(log[m.id+'@'+x])tk++}))});
  const wAvg=days.reduce((a,d)=>a+(D.water[d]||0),0)/7;
  const rows=Object.keys(MEAS).map(k=>{const L=lastMeas(k);if(!L.length)return '';const last=L[0],prev=L[1];
    const unit=MEAS[k].u;let ch='';if(prev){const dv=Math.round(((+last.value)-(+prev.value))*10)/10;ch=dv===0?'өөрчлөлтгүй':(dv>0?'▲ ':'▼ ')+Math.abs(dv)+(k==='bp'?'':' '+unit)}
    const vals=L.slice(0,10).reverse().map(h=>+h.value);
    return `<div class="rrow" style="cursor:pointer" onclick="measForm(null,'${k}')"><span class="ri" style="color:${H_COLOR[k]}"><svg viewBox="0 0 24 24" class="cico">${H_SVG[k]}</svg></span>
      <div class="rm"><div class="rt"><span>${MEAS[k].l}</span><span class="amt">${measVal(last)}</span></div>${spark(vals,H_COLOR[k])}<div class="meta">${dayLabel(last.date)}${ch?' · '+ch:''}${L.length>1?' · '+L.length+' хэмжилт':''}</div></div></div>`}).join('');
  return `<div class="card"><h2>Эрүүл мэндийн тайлан</h2>
    <div class="stats" style="margin-bottom:8px"><div class="stat"><small>Эм (7 хоног)</small><b>${sch?Math.round(100*tk/sch)+'%':'—'}</b></div>
    <div class="stat"><small>Ус (дундаж)</small><b>${fmtH(wAvg)} аяга</b></div><div class="stat"><small>Ирэх үзлэг</small><b>${(()=>{const i=D.items.filter(x=>x.appt&&!x.done&&x.date>=t).sort((a,b)=>a.date.localeCompare(b.date))[0];return i?dayLabel(i.date).replace(/ .*/,''):'—'})()}</b></div></div>
    ${rows||'<div class="empty">Дээрх дүрс дээр дарж жин, даралт, сахар зэргээ бичвэл энд өөрчлөлт, график нь гарна.</div>'}
    ${D.health.length?`<div class="row-btns"><span class="sp"></span><button class="lnk" onclick="UI.sec='meas';UI.back='health';UI.subTitle='Хэмжилт';render()">Бүх хэмжилт →</button></div>`:''}</div>`;
}
const measVal=h=>h.type==='bp'?`${h.value}/${h.value2||'?'}`:`${h.value} ${MEAS[h.type].u}`;
function toggleMed(k){const t=today();D.medLog[t]=D.medLog[t]||{};D.medLog[t][k]=!D.medLog[t][k];if(!D.medLog[t][k])delete D.medLog[t][k];save();render()}
function medStreak(m){let n=0,d=today();const full=day=>(m.times||[]).every(tm=>(D.medLog[day]||{})[m.id+'@'+tm]);if(!full(d))d=addDays(d,-1);while(full(d)&&n<999){n++;d=addDays(d,-1)}return n}

let _idb=null;
function idb(){return _idb||(_idb=new Promise((res,rej)=>{const r=indexedDB.open('miniiudur-img',1);r.onupgradeneeded=()=>r.result.createObjectStore('imgs');r.onsuccess=()=>res(r.result);r.onerror=()=>{_idb=null;rej(r.error)}}))}
async function idbDo(mode,fn){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('imgs',mode);const r=fn(tx.objectStore('imgs'));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('Хадгалах зай хүрэлцсэнгүй'))})}
const imgPut=(id,blob)=>idbDo('readwrite',s=>s.put(blob,id));
const imgGet=id=>idbDo('readonly',s=>s.get(id));
const imgDel=id=>{const u=IMGURL.get(id);if(u){URL.revokeObjectURL(u);IMGURL.delete(id)}return idbDo('readwrite',s=>s.delete(id))};
const imgKeys=()=>idbDo('readonly',s=>s.getAllKeys());
const IMGURL=new Map();
async function imgUrl(id){if(IMGURL.has(id))return IMGURL.get(id);try{let b=await imgGet(id);if(!b)b=await cloudPhoto(id);if(!b)return '';const u=URL.createObjectURL(b);IMGURL.set(id,u);return u}catch(e){return ''}}
function hydrateImgs(root){(root||document).querySelectorAll('img[data-img]:not([src])').forEach(async el=>{const u=await imgUrl(el.dataset.img);if(u)el.src=u;else el.closest('.ph')&&el.closest('.ph').classList.add('missing')})}
function compressImage(file,max=1600,q=.8){
  return new Promise((res,rej)=>{const img=new Image();
    img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(img.src);
      c.toBlob(b=>b?res(b):rej(new Error('Зураг хувиргаж чадсангүй')),'image/jpeg',q)};
    img.onerror=()=>{URL.revokeObjectURL(img.src);rej(new Error('Зураг уншиж чадсангүй'))};
    img.src=URL.createObjectURL(file)});
}
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});

function checkReminders(){
  const n=now();const t=today();const tm=addDays(t,1);let changed=false;
  const fire=(key,title,body)=>{if(D.notified[key])return;D.notified[key]=t;changed=true;notify(title,body)};
  const W=10*60000; // 10 мин цонх
  D.items.forEach(i=>{if(!i.time)return;[t,tm].forEach(day=>{if(!occurs(i,day)||isDone(i,day))return;
    const [y,mo,d]=day.split('-').map(Number);const [h,mi]=i.time.split(':').map(Number);
    const start=new Date(y,mo-1,d,h,mi).getTime();
    const title=(i.appt?(APPT[i.appt]||APPT.other).i+' ':i.type==='event'?'📅 ':'✅ ')+i.title;
    const body=(day===t?'Өнөөдөр ':'Маргааш ')+i.time+(i.place?' · '+i.place:'')+(i.prep?' · '+i.prep:'');
    [i.remind,i.remind2].forEach((r,k)=>{if(r===undefined||r===null||r===''||+r<0)return;
      const at=r==='eve'?new Date(y,mo-1,d-1,20,0).getTime():start-(+r||0)*60000;
      // апп хаалттай байсан бол ч цаг нь болохоос өмнө нээхэд нэг удаа сануулна
      if(n>=at&&n<Math.max(start,at+W))fire('i'+i.id+day+'_'+k,title,body)})})});
  const mins=n.getHours()*60+n.getMinutes();
  D.meds.forEach(m=>(m.times||[]).forEach(x=>{const k=m.id+'@'+x;if((D.medLog[t]||{})[k])return;const d=mins-toMin(x);
    if(d>=0&&d<60)fire('m'+k+t,'💊 '+m.name,'Эм уух цаг '+x+(m.dose?' · '+m.dose:''))}));
  if(mins>=8*60&&mins<12*60){
    const tasks=D.items.filter(i=>!i.time&&occurs(i,t)&&!isDone(i,t)).length;
    const bills=billsDue(1).length;
    if(tasks||bills)fire('morning'+t,'☀️ Өнөөдөр',[tasks?tasks+' ажил':'',bills?bills+' төлбөр ойртсон':''].filter(Boolean).join(', '));
  }
  // Тайлан бичих сануулга (сүүлийн 2 долоо хоногт тайлан бичсэн бол)
  const rr=D.settings.reportRemind;if(rr&&repActive()&&mins>=toMin(rr)&&mins<toMin(rr)+240&&!repGet(t))fire('rep'+t,'📋 Тайлан','Өнөөдөр аль өрөөнд хэдэн хүн оруулснаа бичих үү?');
  // Сарын сүүлийн өдөр: илүү цагийн нэгтгэл
  if(addDays(t,1).slice(8)==='01'&&mins>=18*60&&mins<23*60){const s=otMonth(ym(t));if(s.L.length)fire('otm'+ym(t),'⏱ Энэ сарын илүү цаг',fmtH(s.tot)+' цаг · '+s.days+' өдөр'+(D.settings.otRate?' · '+money(s.tot*D.settings.otRate):''))}
  if(mins>=21*60&&mins<23*60&&!(D.journal[t]&&D.journal[t].mood))fire('j'+t,'✍️ Оройн 2 минут','Өнөөдөр ямар байв?');
  Object.keys(D.notified).forEach(k=>{if(D.notified[k]<addDays(t,-2)){delete D.notified[k];changed=true}});
  if(changed)save();
}

function stable(v){if(Array.isArray(v))return '['+v.map(stable).join(',')+']';
  if(v&&typeof v==='object')return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';
  return JSON.stringify(v===undefined?null:v)}
const clean=o=>JSON.parse(JSON.stringify(o));
// 3 талын нэгтгэл: L=энэ төхөөрөмж, C=үүл, s=сүүлд синк хийсэн төлөв. Буцаах: үүл рүү бичих үйлдлүүд.
function reconcileSpace(sp,cloud,sy){
  const loc=sp.local();const ops=[];
  new Set([...loc.keys(),...cloud.keys(),...Object.keys(sy)]).forEach(id=>{
    const L=loc.get(id),C=cloud.get(id),s=sy[id];const lj=L&&stable(clean(L)),cj=C&&stable(C);
    if(L&&C){if(lj===cj){sy[id]=cj}
      else if(s===undefined||lj===s){sp.apply(id,C);sy[id]=cj}     // зөвхөн үүл өөрчлөгдсөн (эсвэл анх удаа) → үүлийнх
      else{ops.push(['set',id,L]);sy[id]=lj}}                         // энд өөрчилсөн → энэ төхөөрөмжийнх
    else if(L){if(s!==undefined&&lj===s){sp.apply(id,null);delete sy[id]}   // өөр төхөөрөмж дээр устгасан
      else{ops.push(['set',id,L]);sy[id]=lj}}                         // шинээр нэмсэн
    else if(C){if(s!==undefined&&cj===s){ops.push(['del',id]);delete sy[id]} // энд устгасан
      else{sp.apply(id,C);sy[id]=cj}}                                  // өөр төхөөрөмж дээр нэмсэн
    else delete sy[id];
  });
  return ops;
}
// Тухайн мөчийн өөрчлөлтүүд (сүүлийн синктэй харьцуулж)
function diffSpace(sp,sy){
  const loc=sp.local(),ops=[];
  loc.forEach((L,id)=>{const lj=stable(clean(L));if(sy[id]!==lj){ops.push(['set',id,L]);sy[id]=lj}});
  Object.keys(sy).forEach(id=>{if(!loc.has(id)){ops.push(['del',id]);delete sy[id]}});
  return ops;
}

  const DM=['medLog','habitLog','water','journal'];
  S.push({name:'days',
    local:()=>{const m=new Map();new Set(DM.flatMap(k=>Object.keys(D[k]||{}))).forEach(d=>{const o={id:d};
      DM.forEach(k=>{const v=(D[k]||{})[d];if(v&&(typeof v!=='object'||Object.keys(v).length))o[k]=v});if(Object.keys(o).length>1)m.set(d,o)});return m},
    apply:(id,o)=>{DM.forEach(k=>{D[k]=D[k]||{};if(o&&o[k]!=null)D[k][id]=o[k];else delete D[k][id]})}});
  S.push({name:'meta',
    local:()=>{const s={};META_SET.forEach(k=>{const v=D.settings[k];if(v!==undefined&&v!==''&&v!==null)s[k]=v});return new Map([['main',{id:'main',budget:D.budget||0,s}]])},
    apply:(id,o)=>{if(!o)return;D.budget=o.budget||0;META_SET.forEach(k=>{D.settings[k]=o.s&&o.s[k]!==undefined?o.s[k]:DEF.settings[k]})}});
  return S;
}

function cloudPush(){

async function commitOps(ops){
  setFbState('saving');
  try{for(let i=0;i<ops.length;i+=400){const b=fb.writeBatch(fbDb);
      ops.slice(i,i+400).forEach(([sp,op,id,o])=>op==='set'?b.set(docRef(sp,id),clean(o)):b.delete(docRef(sp,id)));await b.commit()}
    if(fbState!=='error')setFbState('ok')}
  catch(e){cloudError(e);SY={};lsSet(SY_KEY,SY)} // дараагийн удаа бүгдийг дахин тулгана

function cloudUnsub(){fbUnsubs.forEach(u=>{try{u()}catch(e){}});fbUnsubs=[]}
function cloudSubscribe(){
  cloudUnsub();fbReconciled=false;setFbState('loading');const latest={};const S=spaces();
  S.forEach(sp=>{
    fbUnsubs.push(fb.onSnapshot(fb.collection(fbDb,'users',fbUser.uid,'mu_'+sp.name),{includeMetadataChanges:true},snap=>{
      if(!fbReconciled){
        if(snap.metadata.fromCache)return; // серверийн бүтэн хариуг хүлээнэ
        latest[sp.name]=new Map(snap.docs.map(d=>{const o=d.data();return [String(o.id!=null?o.id:d.id),o]}));
        if(!S.every(x=>latest[x.name]))return;
        const ops=[];S.forEach(x=>reconcileSpace(x,latest[x.name],SY[x.name]=SY[x.name]||{}).forEach(op=>ops.push([x.name,...op])));
        fbReconciled=true;lsSet(SY_KEY,SY);saveLocal();scheduleRender();
        if(ops.length)commitOps(ops);else setFbState('ok');syncPhotos();return;
      }
      const sy=SY[sp.name]=SY[sp.name]||{};let ch=false;
      snap.docChanges().forEach(c=>{
        if(c.doc.metadata.hasPendingWrites)return; // өөрийн бичилт
        const o=c.doc.data();const id=String(o&&o.id!=null?o.id:c.doc.id);
        if(c.type==='removed'){const L=sp.local().get(id);if(L&&stable(clean(L))===sy[id]){sp.apply(id,null);ch=true}delete sy[id];return}
        const j=stable(o);if(sy[id]===j)return;sp.apply(id,o);sy[id]=j;ch=true;
      });
      if(ch){lsSet(SY_KEY,SY);saveLocal();scheduleRender()}
    },e=>cloudError(e)));
  });
}

async function photoForCloud(b){
  if(b.size>600000){try{const bm=await createImageBitmap(b);const k=Math.min(1,1280/Math.max(bm.width,bm.height));const c=document.createElement('canvas');
    c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    b=await new Promise(r=>c.toBlob(r,'image/jpeg',.72))||b}catch(e){}}
  return (await blobToDataURL(b)).split(',')[1];
}

      await fb.setDoc(docRef('photos',id),{d:await photoForCloud(b),t:'image/jpeg'});up.add(id);lsSet(UP_KEY,[...up])}
    for(const id of [...up])if(!used.has(id)){await fb.deleteDoc(docRef('photos',id)).catch(()=>{});up.delete(id);lsSet(UP_KEY,[...up])}
  }catch(e){cloudError(e)}finally{syncPhotos.busy=false}

}

async function fbEmail(){
  if(!fbOK)return location.reload();
  const e=$('#aEmail').value.trim(),p=$('#aPass').value;if(!e||!p)return showAuth(true,'Имэйл, нууц үгээ бичнэ үү.');
  $('#aSubmit').disabled=true;showAuth(true,'');
  try{if(fbSignUp)await fb.createUserWithEmailAndPassword(fbAuth,e,p);else await fb.signInWithEmailAndPassword(fbAuth,e,p);$('#aPass').value=''}
  catch(x){showAuth(true,authErr(x))}
  $('#aSubmit').disabled=false;
}
async function fbGoogle(){
  if(!fbOK)return location.reload();
  const pr=new fb.GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});
  try{await fb.signInWithPopup(fbAuth,pr)}
  catch(e){const c=(e&&e.code)||'';
    if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){try{await fb.signInWithRedirect(fbAuth,pr)}catch(e2){showAuth(true,authErr(e2))}}
    else if(!/cancelled-popup|popup-closed/.test(c))showAuth(true,authErr(e))}
}
async function fbReset(){
  if(!fbOK)return;const e=$('#aEmail').value.trim();if(!e)return showAuth(true,'Эхлээд имэйлээ бичнэ үү.');
  try{await fb.sendPasswordResetEmail(fbAuth,e);showAuth(true,'Нууц үг сэргээх холбоос имэйл рүү илгээгдлээ.',true)}catch(x){showAuth(true,authErr(x))}
}
function authErr(e){const c=(e&&e.code)||'';return ({'auth/invalid-email':'Имэйл буруу байна.','auth/user-not-found':'Ийм бүртгэл алга.','auth/wrong-password':'Нууц үг буруу.',
  'auth/invalid-credential':'Имэйл эсвэл нууц үг буруу.','auth/email-already-in-use':'Энэ имэйлээр бүртгэл үүссэн байна — “Нэвтрэх” дарна уу.',
  'auth/weak-password':'Нууц үг хамгийн багадаа 6 тэмдэгт.','auth/too-many-requests':'Олон удаа оролдлоо. Түр хүлээгээд дахин оролдоно уу.',
  'auth/network-request-failed':'Интернет холболтоо шалгана уу.','auth/unauthorized-domain':'Энэ хаягаас нэвтрэх зөвшөөрөлгүй (Firebase → Authentication → Authorized domains).',
  'auth/operation-not-allowed':'Энэ нэвтрэх арга Firebase дээр идэвхжээгүй байна.'})[c]||('Алдаа: '+((e&&e.message)||c))}
async function logout(){
  if(!fbUser)return;
  if(!confirm('Гарах уу?\n\nМэдээлэл тань үүлэнд хадгалагдсан хэвээр, дахин нэвтрэхэд сэргэнэ. Энэ төхөөрөмж дээрх хуулбар устна.'))return;
  closeSheet();closeDrawer();cloudPush();
  const done=await Promise.race([fb.waitForPendingWrites(fbDb).then(()=>true).catch(()=>true),new Promise(r=>setTimeout(()=>r(false),6000))]);
  if(!done&&!confirm('Сүүлийн өөрчлөлтүүд үүлэнд хараахан хүрээгүй байна (интернетээ шалгана уу). Тэгсэн ч гарах уу?'))return;
  cloudUnsub();try{await fb.signOut(fbAuth)}catch(e){}
  wipeLocal();try{localStorage.removeItem(OWNER_KEY)}catch(e){}
  try{await fb.terminate(fbDb);await fb.clearIndexedDbPersistence(fbDb)}catch(e){}
  location.reload();
}
window.addEventListener('online',()=>{if(fbReconciled)cloudPush()});

/* ===================== Android апп (Capacitor): апп хаалттай үед ч сануулах ===================== */
// Вэб дээр энэ хэсэг юу ч хийхгүй. APK дотор сануулгыг Android-ын системд 14 хоногоор урьдчилж тавина.
(function(){
  const C=window.Capacitor;const isNative=!!(C&&C.isNativePlatform&&C.isNativePlatform());
  window.NativeApp={isNative,resync(){}};
  if(!isNative)return;
  document.documentElement.classList.add('is-native');
  const plug=n=>C.registerPlugin?C.registerPlugin(n):C.Plugins[n];
  const LN=plug('LocalNotifications'),Share=plug('Share'),FS=plug('Filesystem'),App=plug('App'),FA=plug('FirebaseAuthentication');
  const CH='reminders',MED='MED_ACTIONS',DAYS=14,MAX=420,SNOOZE_BASE=900000,SNOOZE_MIN=15;
  let ready=false,timer=null,running=false,again=false;
  const dt=(day,hm)=>{const [y,m,d]=day.split('-').map(Number);const [h,mi]=hm.split(':').map(Number);return new Date(y,m-1,d,h,mi).getTime()};
  async function granted(){try{return (await LN.checkPermissions()).display==='granted'}catch(e){return false}}
  function resync(){clearTimeout(timer);timer=setTimeout(run,800)}
  async function run(){if(!ready)return;if(running){again=true;return}running=true;try{await schedule()}catch(e){console.warn('reminder sync',e)}running=false;if(again){again=false;resync()}}
  // Бүх сануулгын жагсаалтыг одоогийн мэдээллээс бүтээнэ
  function build(){
    const nowMs=Date.now()+5000,t=today(),L=[];const add=(at,title,body,extra,med)=>{if(at>nowMs)L.push({at,title,body,extra,med})};
    for(let k=0;k<DAYS;k++){
      const day=addDays(t,k);
      // Уулзалт, ажил, эмчийн цаг
      D.items.forEach(i=>{if(!i.time||!occurs(i,day)||isDone(i,day))return;const start=dt(day,i.time);
        const title=(i.appt?(APPT[i.appt]||APPT.other).i+' ':i.type==='event'?'📅 ':'✅ ')+i.title;
        const body=dayLabel(day)+' '+i.time+(i.place?' · '+i.place:'')+(i.prep?' · '+i.prep:'');
        [i.remind,i.remind2].forEach(r=>{if(r===undefined||r===null||r===''||+r<0)return;add(r==='eve'?dt(addDays(day,-1),'20:00'):start-(+r||0)*60000,title,body)})});
      // Эм: цагт нь + 30 мин дараа дахин
      const log=D.medLog[day]||{};
      D.meds.forEach(m=>(m.times||[]).forEach(x=>{const key=m.id+'@'+x;if(log[key])return;const at=dt(day,x);const body=m.name+(m.dose?' — '+m.dose:'')+' ('+x+')';
        add(at,'💊 Эм уух цаг боллоо',body,{key,date:day},true);add(at+30*60000,'⏰ Эмээ уусан уу?',body,{key,date:day},true)}));
      // Өглөөний тойм
      const tasks=D.items.filter(i=>!i.time&&occurs(i,day)&&!isDone(i,day)).length;
      if(tasks)add(dt(day,'08:00'),'☀️ Өнөөдөр',tasks+' ажил хийх төлөвлөгөөтэй');
      // Оройн 2 минут
      if(!(D.journal[day]&&D.journal[day].mood))add(dt(day,'21:00'),'✍️ Оройн 2 минут','Өнөөдөр ямар байв?');
      // Тайлан
      const rr=D.settings.reportRemind;if(rr&&repActive()&&!repGet(day))add(dt(day,rr),'📋 Тайлан','Өнөөдөр аль өрөөнд хэдэн хүн оруулснаа бичих үү?');
      // Сарын сүүлийн өдөр: илүү цаг
      if(addDays(day,1).slice(8)==='01'){const s=otMonth(ym(day));if(s.L.length)add(dt(day,'18:00'),'⏱ Энэ сарын илүү цаг',fmtH(s.tot)+' цаг · '+s.days+' өдөр')}
    }
    // Тогтмол төлбөр (энэ ба ирэх сар)
    const n=now();[0,1].forEach(off=>{const base=new Date(n.getFullYear(),n.getMonth()+off,1);const mo=base.getFullYear()+'-'+pad(base.getMonth()+1);const last=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
      D.bills.forEach(b=>{if((b.paid||[]).includes(mo))return;const day=mo+'-'+pad(Math.min(b.day,last));add(dt(day,'09:00'),'🧾 Төлбөр: '+b.name,money(b.amount)+' — өнөөдөр төлөх')})});
    return L.sort((a,b)=>a.at-b.at).slice(0,MAX);
  }
  async function schedule(){
    if(!(await granted()))return;
    const pending=(await LN.getPending()).notifications||[];
    const cancel=pending.filter(x=>x.id<SNOOZE_BASE).map(x=>({id:x.id}));
    if(cancel.length)await LN.cancel({notifications:cancel});
    const list=build().map((x,i)=>({id:1000+i,channelId:CH,title:x.title,body:x.body,schedule:{at:new Date(x.at),allowWhileIdle:true},autoCancel:true,
      ...(x.med?{actionTypeId:MED,group:'med-'+x.extra.date+x.extra.key,extra:x.extra}:{})}));
    if(list.length)await LN.schedule({notifications:list});
  }
  async function onAction(ev){
    const n=ev.notification||{},ex=n.extra||{};
    try{
      if(ev.actionId==='taken'&&ex.key){D.medLog[ex.date]=D.medLog[ex.date]||{};D.medLog[ex.date][ex.key]=true;save();render();toast('✓ Эм уусан гэж тэмдэглэлээ')}
      else if(ev.actionId==='snooze'){await LN.schedule({notifications:[{id:SNOOZE_BASE+(Math.floor(Date.now()/1000)%90000),channelId:CH,title:'⏰ Эмээ уусан уу?',body:n.body||'',
        schedule:{at:new Date(Date.now()+SNOOZE_MIN*60000),allowWhileIdle:true},actionTypeId:MED,extra:ex,autoCancel:true}]});toast(SNOOZE_MIN+' минутын дараа дахин сануулна');try{App.minimizeApp()}catch(e){}}
      else if(ex.key){UI.life='health';setView('life')}
    }catch(e){console.warn(e)}
    resync();
  }
  function onBack(){
    if(!$('#lightbox').classList.contains('hidden'))return $('#lightbox').classList.add('hidden');
    if(!$('#sheet').classList.contains('hidden'))return closeSheet();
    if(!$('#drawer').classList.contains('hidden'))return closeDrawer();
    if(UI.back)return goBack();
    if(VIEW==='grp'||VIEW!=='home')return setView('home');
    App.minimizeApp();
  }
  async function shareFile(name,text,mime,title){
    try{const r=await FS.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'});await Share.share({title,dialogTitle:title,files:[r.uri]});return true}catch(e){return false}
  }
  async function shareText(text,title){try{await Share.share({title,text,dialogTitle:title});return true}catch(e){return false}}
  async function requestPermission(){
    let p;try{p=await LN.requestPermissions()}catch(e){p={display:'denied'}}
    if(p.display!=='granted')toast('Тохиргоо → Апп → Миний өдөр → Мэдэгдэл хэсгээс асаана уу');
    try{const ex=(await LN.checkExactNotificationSetting()).exact_alarm;if(ex!=='granted'&&confirm('Сануулга яг цагтаа ирэхийн тулд "Сэрүүлэг ба сануулга" зөвшөөрлийг асаах уу?'))await LN.changeExactNotificationSetting()}catch(e){}
    resync();return p.display==='granted';
  }
  async function setup(){
    try{await LN.createChannel({id:CH,name:'Сануулга',description:'Эм, уулзалт, эмчийн цаг, төлбөрийн сануулга',importance:5,visibility:1,vibration:true,lights:true,lightColor:'#5b8c7b'})}catch(e){}
    try{await LN.registerActionTypes({types:[{id:MED,actions:[{id:'taken',title:'Уусан ✓'},{id:'snooze',title:SNOOZE_MIN+' мин дараа'}]}]})}catch(e){}
    LN.addListener('localNotificationActionPerformed',onAction);
    App.addListener('backButton',onBack);
    App.addListener('resume',()=>{try{checkReminders();render()}catch(e){}resync()});
    // Гадны холбоос (Google Sheet г.м.) системийн хөтөч/апп-аар нээгдэнэ
    window.open=url=>{if(url)location.href=url;return null};
    ready=true;
    try{const p=await LN.checkPermissions();if(p.display==='granted'){if(!D.settings.notify){D.settings.notify=true;saveLocal()}}else if(p.display!=='denied'){if(await requestPermission()){D.settings.notify=true;saveLocal()}}}catch(e){}
    resync();
  }
  // Мэдээлэл өөрчлөгдөх бүрт (энэ төхөөрөмж эсвэл үүлнээс ирсэн) сануулгыг шинэчилнэ
  const _saveLocal=saveLocal;saveLocal=function(){_saveLocal();resync()};
  // Апп доторх Google нэвтрэлт (popup вэб дээр л ажилладаг)
  fbGoogle=async function(){
    if(!fbOK)return location.reload();
    try{const r=await FA.signInWithGoogle();const tok=r&&r.credential&&r.credential.idToken;if(!tok){showAuth(true,'Google нэвтрэлт амжилтгүй. Дахин оролдоно уу.');return}
      await fb.signInWithCredential(fbAuth,fb.GoogleAuthProvider.credential(tok))}
    catch(e){const m=String((e&&(e.message||e.code))||'');if(/cancel/i.test(m))return;showAuth(true,e&&e.code&&String(e.code).startsWith('auth/')?authErr(e):'Google нэвтрэлт амжилтгүй: '+m)}
  };
  const _logout=logout;logout=async function(){try{await FA.signOut()}catch(e){}return _logout()};
  window.NativeApp={isNative:true,resync,shareFile,shareText,requestPermission};
  window.addEventListener('load',setup);
})();

/* ===================== Эхлүүлэх ===================== */
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{if(b.dataset.v==='life')UI.life='health';if(b.dataset.v==='plan')UI.planCat='all';setView(b.dataset.v)});
try{const v=localStorage.getItem(KEY+'.view');if(v&&['home','today','plan','notes','money','life'].includes(v))VIEW=v}catch(e){}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();closeDrawer()}});
let _lastDay=today();
setInterval(()=>{checkReminders();if(today()!==_lastDay){_lastDay=today();if($('#sheet').classList.contains('hidden'))render()}},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkReminders();if($('#sheet').classList.contains('hidden'))render()}});
render();checkReminders();setTimeout(gcImages,3000);cloudInit();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&!(window.NativeApp&&NativeApp.isNative))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
