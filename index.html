<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Миний өдөр</title>
<meta name="description" content="Ажил, уулзалт, тэмдэглэл, санхүү, эрүүл мэнд, ахуй — нэг дор">
<meta name="theme-color" content="#5b8c7b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css?v=1.9.4">
</head>
<body>
<header class="top">
  <button class="hbtn" id="navBtn" onclick="openMenu()" aria-label="Цэс"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <h1 id="title">Миний өдөр</h1>
  <button class="hbtn" onclick="openBell()" aria-label="Сануулга"><svg viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><b id="bellN" class="hidden"></b></button>
</header>
<main id="view"></main>
<button class="fab" onclick="openQuick()" aria-label="Нэмэх">＋</button>
<nav class="tabs" id="tabs">
  <button data-v="home" aria-label="Нүүр"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg></button>
  <button data-v="today" aria-label="Өнөөдөр"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <button data-v="plan" aria-label="Төлөвлөгөө"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
  <button data-v="money" aria-label="Санхүү"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg></button>
  <button data-v="life" aria-label="Эрүүл & Ахуй"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
</nav>
<div id="auth" class="auth hidden">
  <div class="auth-box">
    <img src="icon-192.png" class="auth-logo" alt="">
    <h1>Миний өдөр</h1>
    <div class="sub" style="margin-bottom:10px">Ажил, эрүүл мэнд, санхүү — нэг дор</div>
    <button class="btn gbtn" onclick="fbGoogle()"><svg viewBox="0 0 48 48" width="20" height="20"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Google-ээр нэвтрэх</button>
    <div class="or">эсвэл имэйлээр</div>
    <input id="aEmail" type="email" placeholder="Имэйл" autocomplete="email">
    <input id="aPass" type="password" placeholder="Нууц үг (6+ тэмдэгт)" autocomplete="current-password" onkeydown="if(event.key==='Enter')fbEmail()">
    <button class="btn primary" id="aSubmit" onclick="fbEmail()">Нэвтрэх</button>
    <div class="auth-links"><button class="lnk" id="aToggle" onclick="fbToggle()">Бүртгэл үүсгэх</button><button class="lnk" onclick="fbReset()">Нууц үгээ мартсан</button></div>
    <div id="aMsg" class="auth-msg"></div>
    <div class="small" style="margin-top:14px">🔒 Таны мэдээлэл зөвхөн танд харагдана.</div>
  </div>
</div>
<div id="drawer" class="drawer hidden"><div class="drawer-bg" onclick="closeDrawer()"></div><aside class="drawer-body" id="drawerBody"></aside></div>
<input type="file" id="avatarInput" accept="image/*" class="hidden" onchange="setAvatar(event)">
<input type="file" id="camIn" accept="image/*" capture="environment" class="hidden" onchange="addPhotos(event)">
<input type="file" id="galIn" accept="image/*" multiple class="hidden" onchange="addPhotos(event)">
<div id="lightbox" class="lightbox hidden" onclick="this.classList.add('hidden')"></div>
<div id="sheet" class="sheet hidden"><div class="sheet-bg" onclick="closeSheet()"></div><div class="sheet-body" id="sheetBody"></div></div>
<input type="file" id="restoreInput" accept=".txt,.json,text/plain,application/json" class="hidden" onchange="importBackup(event)">
<div id="toast" class="toast"></div>

<script>const VERSION='1.9.4';</script>
<script src="js/data.js?v=1.9.4"></script>
<script src="js/logic.js?v=1.9.4"></script>
<script src="js/views.js?v=1.9.4"></script>
<script src="js/pages.js?v=1.9.4"></script>
<script src="js/roster.js?v=1.9.4"></script>
<script src="js/rtsheet.js?v=1.9.4"></script>
<script src="js/forms.js?v=1.9.4"></script>
<script src="js/settings.js?v=1.9.4"></script>
<script src="js/reminders.js?v=1.9.4"></script>
<script src="js/cloud.js?v=1.9.4"></script>
<script src="js/native.js?v=1.9.4"></script>
<script src="js/main.js?v=1.9.4"></script>
</body>
</html>
